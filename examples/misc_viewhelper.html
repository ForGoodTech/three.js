<!DOCTYPE html>
<html lang="en">
<head>
    <title>three.js misc - view helper</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <link type="text/css" rel="stylesheet" href="main.css">
</head>
<body>
    <div id="info">
        <a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - view helper
    </div>
    <script type="importmap">
    {
        "imports": {
            "three": "../build/three.module.js",
            "three/addons/": "./jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { ViewHelper } from 'three/addons/helpers/ViewHelper.js';

        let camera, scene, renderer, controls, viewHelper;
        const clock = new THREE.Clock();

        init();

        function init() {

            scene = new THREE.Scene();
            scene.background = new THREE.Color( 0xaaaaaa );

            camera = new THREE.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 1, 1000 );
            camera.position.set( 5, 5, 5 );

            renderer = new THREE.WebGLRenderer( { antialias: true } );
            renderer.setPixelRatio( window.devicePixelRatio );
            renderer.setSize( window.innerWidth, window.innerHeight );
            renderer.setAnimationLoop( animate );
            document.body.appendChild( renderer.domElement );

            controls = new OrbitControls( camera, renderer.domElement );
            controls.update();

            const grid = new THREE.GridHelper( 10, 10 );
            scene.add( grid );

            const geometry = new THREE.BoxGeometry();
            const material = new THREE.MeshNormalMaterial();
            const mesh = new THREE.Mesh( geometry, material );
            scene.add( mesh );

            viewHelper = new ViewHelper( camera, renderer.domElement );
            viewHelper.center = controls.target;

            window.addEventListener( 'resize', onWindowResize );
        }

        function onWindowResize() {

            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();

            renderer.setSize( window.innerWidth, window.innerHeight );

        }

        function animate() {

            const delta = clock.getDelta();
            if ( viewHelper.animating === true ) viewHelper.update( delta );

            renderer.render( scene, camera );
            viewHelper.render( renderer );

        }
    </script>
</body>
</html>
